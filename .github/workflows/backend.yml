name: backend
on:
  push:
    branches: [master]
    paths: ['backend/**', '.github/workflows/backend.yml']
jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/choimeeyoung94/chatapp-backend:${{ github.sha }}
            ghcr.io/choimeeyoung94/chatapp-backend:latest
