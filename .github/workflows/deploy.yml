name: deploy
on:
  workflow_run:
    workflows: [backend]
    types: [completed]
    branches: [master]
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd ~/chatapp
            docker pull ghcr.io/choimeeyoung94/chatapp-backend:latest
            docker compose -p chatapp up -d backend
            sleep 60
            curl -fsS http://localhost:8080/api/chat/rooms/open > /dev/null && echo DEPLOY_OK
