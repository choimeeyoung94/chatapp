spring:
  datasource:
    url: jdbc:mysql://localhost:3306/chatdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: chatuser
    password: chatpass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  sql:
    init:
      mode: never # 시드는 DataSeeder가 담당 (빈 data.sql 실행 방지)

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:chatapp-secret-key-for-jwt-signing-must-be-at-least-256-bits-long-1234567890}
  expiration: 86400000

file:
  upload-dir: uploads
  base-url: /uploads

logging:
  level:
    com.chat: INFO
